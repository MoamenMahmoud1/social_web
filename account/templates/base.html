{% load static %}

<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="color-scheme"
        content="light dark"
    >

    <title>
        {% block title %}
            Bookmarks
        {% endblock %}
    </title>

    <script src="{% static 'js/theme-init.js' %}?v=1.0"></script>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >

    <link
        href="{% static 'css/base.css' %}?v=1.0"
        rel="stylesheet"
    >

    <link
        href="{% static 'css/theme.css' %}?v=1.0"
        rel="stylesheet"
    >

    <link
        href="{% static 'css/navbar.css' %}?v=1.0"
        rel="stylesheet"
    >

    {% if messages %}
    <link
        href="{% static 'css/messages.css' %}?v=1.0"
        rel="stylesheet"
    >
    {% endif %}

    {% block extra_css %}
    {% endblock %}
</head>

<body>
    {% include "includes/navbar.html" %}
    {% include "includes/messages.html" %}

    <main
        id="content"
        class="site-container page-content"
    >
        {% block content %}
        {% endblock %}
    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"
    ></script>

    <script src="{% static 'js/theme.js' %}?v=1.0"></script>
    

    {% block extra_js %}
    {% endblock %}
</body>
</html>
