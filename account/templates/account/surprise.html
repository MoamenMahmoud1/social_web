<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مفاجأة الأربع سنين 🎉</title>
  <style>
    :root{
      --bg1:#ffecd2; /* soft peach */
      --bg2:#fcb69f; /* warm coral */
      --primary:#ff2d55; /* celebration pink */
      --deep:#8b2cff; /* accent */
      --card:#ffffffee;
      --text:#1f2937;
      --gold:#f5b700;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Kufi Arabic", "Noto Sans Arabic", Arial, sans-serif;
      color:var(--text);
      background: radial-gradient(1200px 800px at 80% -10%, #ffd6e7 0%, transparent 60%),
                  radial-gradient(1000px 700px at 0% 120%, #d6f3ff 0%, transparent 60%),
                  linear-gradient(135deg,var(--bg1),var(--bg2));
      overflow-x:hidden;
    }

    .wrap{
      min-height:100%;
      display:grid;
      place-items:center;
      padding:24px;
    }

    .title{
      position:fixed; top:16px; inset-inline:0; text-align:center; pointer-events:none;
      font-weight:700; letter-spacing:.3px; opacity:.9;
    }

    .gift-area{ position:relative; display:grid; place-items:center; gap:22px; }

    /* Gift box */
    .gift{
      position:relative;
      width: 260px; height: 200px;
      perspective:1200px;
      cursor:pointer;
      user-select:none;
    }
    .gift .base{
      position:absolute; inset:auto 0 0 0; height: 150px; border-radius:18px;
      background: repeating-linear-gradient( 90deg, #fff 0 22px, var(--deep) 22px 30px);
      box-shadow:0 18px 40px rgba(0,0,0,.15), inset 0 0 0 6px #fff;
    }
    .gift .lid{
      position:absolute; inset:0; height: 90px; transform-origin: left bottom;
      background: linear-gradient(90deg, var(--deep), #7a4bff);
      border-radius:18px; box-shadow:0 12px 24px rgba(0,0,0,.18);
      display:flex; align-items:center; justify-content:center; gap:10px; color:#fff;
    }
    .ribbon{ position:absolute; inset:0; display:grid; place-items:center; }
    .ribbon::before, .ribbon::after{
      content:""; position:absolute; width:18px; inset:0 auto; background:var(--gold); filter:saturate(110%);
    }
    .ribbon::before{ inset-inline-start:50%; transform:translateX(-50%); }
    .ribbon::after{ inset-inline-start:auto; inset-inline-end:50%; transform:translateX(50%); opacity:0; }

    .lock{ width:28px; height:28px; }

    .hint{ font-size:.95rem; opacity:.9; background:#ffffffaa; padding:8px 14px; border-radius:999px; backdrop-filter: blur(6px); }

    /* Card revealed */
    .card{
      position:absolute; inset: auto 50% 170px auto; transform:translateX(50%) translateY(20px) scale(.96);
      width:min(92vw, 520px);
      background:var(--card);
      border-radius:22px; padding:22px 22px 26px;
      box-shadow:0 24px 60px rgba(0,0,0,.25);
      opacity:0; pointer-events:none;
      transition: .6s cubic-bezier(.2,.8,.2,1);
      text-align:center;
    }
    .card h1{ margin:0 0 8px; font-size: clamp(22px, 5vw, 38px); color:#111827; }
    .card p{ margin:0; font-size: clamp(14px, 2.6vw, 18px); opacity:.9 }
    .badges{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px }
    .badge{ padding:6px 12px; border-radius:999px; background:#f8fafc; border:1px solid #e5e7eb; font-size:.9rem }

    .actions{ display:flex; gap:10px; justify-content:center; margin-top:16px }
    .btn{ border:0; padding:10px 16px; border-radius:12px; font-weight:600; cursor:pointer; background:#111827; color:#fff; }
    .btn.ghost{ background:#ffffff; color:#111827; border:1px solid #e5e7eb }

    /* Open state */
    .gift.open .lid{ animation: openLid 1.1s cubic-bezier(.18,.88,.22,1) forwards; }
    .gift.open + .card{ opacity:1; transform:translateX(50%) translateY(-10px) scale(1); pointer-events:auto }

    @keyframes openLid{
      0%{ transform: rotateX(0) rotateZ(0) translateZ(0); }
      40%{ transform: rotateX(-30deg) translateZ(16px); }
      100%{ transform: rotateX(-110deg) rotateZ(-2deg) translateZ(16px); box-shadow: 0 12px 24px rgba(0,0,0,0); }
    }

    /* Confetti */
    .confetti{ position:fixed; top:-10vh; width:10px; height:16px; will-change: transform, opacity; opacity:.95; border-radius:2px; }
    @keyframes fall{
      0%{ transform: translateY(-10vh) rotate(0turn); }
      100%{ transform: translateY(120vh) rotate(2.5turn); }
    }

    /* Hearts/Balloons */
    .float{ position:fixed; bottom:-10vh; font-size:clamp(20px, 4vw, 34px); will-change: transform, opacity; }
    @keyframes rise{
      0%{ transform: translateY(0) translateX(0) scale(.9); opacity:0 }
      10%{ opacity:1 }
      100%{ transform: translateY(-120vh) translateX(var(--x,0)) scale(1.2); opacity:0 }
    }

    /* Footer watermark */
    .footer{ position:fixed; inset-inline:0; bottom:10px; text-align:center; font-size:12px; opacity:.7 }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">جاهزين؟ 👀</div>

    <div class="gift-area">
      <div id="gift" class="gift" aria-label="هدية – اضغط لفتحها" role="button" tabindex="0">
        <div class="lid">
          <!-- lock icon -->
          <svg class="lock" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M7 10V8a5 5 0 0 1 10 0v2" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <rect x="4" y="10" width="16" height="10" rx="3" stroke="white" stroke-width="2"/>
            <circle cx="12" cy="15" r="1.6" fill="white"/>
          </svg>
          <strong>الصندوق مقفول</strong>
        </div>
        <div class="base"></div>
        <div class="ribbon"></div>
      </div>

      <div class="card" id="card" aria-live="polite">
        <h1>أحلى اتنين كملوا <span style="color:var(--primary)">أربع سنين</span> 🎉</h1>
        <p>يا رب دايمًا فرحانين، ومكمّلين على خير وحب.</p>
        <div class="badges">
          <div class="badge">💞 حب كبير</div>
          <div class="badge">🕯️ ذكريات حلوة</div>
          <div class="badge">🎂 سنين جاية أحلى</div>
        </div>
        <div class="actions">
          <button class="btn" id="replay">أعد المفاجأة</button>
          <button class="btn ghost" id="copy">انسخ الرسالة</button>
        </div>
      </div>

      <div class="hint">اضغط على الصندوق لفتح المفاجأة ✨</div>
    </div>

    <div class="footer">صُنعت بحب 💖</div>
  </div>

  <script>
    const gift = document.getElementById('gift');
    const card = document.getElementById('card');
    const replayBtn = document.getElementById('replay');
    const copyBtn = document.getElementById('copy');

    const messageText = 'أحلى اتنين كملوا أربع سنين يوسف و اسراء🎉 يا رب دايمًا فرحانين ومكملين على خير وحب!';

    function random(min, max){ return Math.random() * (max - min) + min }

    function makeConfetti(count=160){
      const colors = ['#ff2d55','#5856d6','#ff9f0a','#34c759','#00c7be','#ffd60a','#ff6b6b'];
      for(let i=0;i<count;i++){
        const p = document.createElement('div');
        p.className='confetti';
        const size = random(7,12);
        p.style.width = size+'px';
        p.style.height = (size*1.4)+'px';
        p.style.left = random(-5, 100)+'vw';
        p.style.transform = `translateY(-10vh) rotate(${random(0,360)}deg)`;
        p.style.background = colors[Math.floor(random(0, colors.length))];
        p.style.animation = `fall ${random(3.8,6.6)}s linear ${random(0,.8)}s forwards`;
        p.style.opacity = .95;
        p.style.zIndex = 10;
        document.body.appendChild(p);
        setTimeout(()=>p.remove(), 8000);
      }
    }

    function makeHearts(count=16){
      const icons = ['💖','💘','💝','🎈'];
      for(let i=0;i<count;i++){
        const h = document.createElement('div');
        h.className='float';
        h.textContent = icons[Math.floor(random(0, icons.length))];
        h.style.left = random(5,95)+'vw';
        h.style.animation = `rise ${random(6,9)}s ease-in ${random(0,.8)}s forwards`;
        h.style.setProperty('--x', (random(-40,40))+'px');
        h.style.zIndex = 9;
        document.body.appendChild(h);
        setTimeout(()=>h.remove(), 10000);
      }
    }

    function openGift(){
      if(gift.classList.contains('open')) return;
      gift.classList.add('open');
      makeConfetti();
      makeHearts();
    }
    function resetGift(){
      gift.classList.remove('open');
      // force reflow
      void gift.offsetWidth;
      setTimeout(openGift, 120);
    }

    gift.addEventListener('click', openGift);
    gift.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openGift(); }});
    replayBtn.addEventListener('click', resetGift);

    copyBtn.addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(messageText);
        copyBtn.textContent = 'اتنسخت ✅';
        setTimeout(()=> copyBtn.textContent='انسخ الرسالة', 1800);
      }catch{
        alert(messageText);
      }
    });
  </script>
</body>
</html>
