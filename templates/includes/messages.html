{% if messages %}
    <div
        class="app-messages"
        aria-live="polite"
        aria-atomic="true"
    >
        {% for message in messages %}
            <div
                class="
                    alert
                    alert-dismissible
                    fade
                    show
                    {% if message.tags == 'error' %}
                        alert-danger
                    {% elif message.tags == 'success' %}
                        alert-success
                    {% elif message.tags == 'warning' %}
                        alert-warning
                    {% elif message.tags == 'info' %}
                        alert-info
                    {% else %}
                        alert-secondary
                    {% endif %}
                "
                role="alert"
            >
                <div class="app-message-content">
                    {{ message }}
                </div>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Close notification"
                ></button>
            </div>
        {% endfor %}
    </div>
{% endif %}
