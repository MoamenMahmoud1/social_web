{% for field in form %}
    <div class="{{ field_wrapper_class|default:'auth-field' }}">
        <label
            for="{{ field.id_for_label }}"
            class="{{ label_class|default:'form-label' }}"
        >
            {{ field.label }}
        </label>

        {{ field }}

        {% for error in field.errors %}
            <div class="invalid-feedback d-block">
                {{ error }}
            </div>
        {% endfor %}

        {% if field.help_text %}
            <div class="form-text">
                {{ field.help_text|safe }}
            </div>
        {% endif %}
    </div>
{% endfor %}
